version: 1
skills:
  - id: add-feature
    title: Add a Feature
    type: skill
    priority: 1
    trigger: |
      When adding a new user-facing capability that spans more than a single endpoint or view.
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: [feature]
      tags: [delivery]
    steps:
      - Identify the entry point (controller, view, scheduled job, or CLI command) and the application service that owns the use-case.
      - Look for existing services, ports, and adapters that already do part of the work. Reuse before introducing.
      - Wire the new behavior through the same layers existing features use; do not invent a new shortcut.
      - Add tests that describe the new behavior before broadening scope or polishing.
      - Update relevant docs (CLAUDE.md or README) only if user-visible behavior changed.
    output_expectations:
      - A single PR with a clear scope statement.
      - Tests covering the happy path and the most likely failure path.
      - No new public types unless a real cross-package caller exists.
    notes: |
      Keep new types package-private until a cross-package caller exists.

  - id: add-endpoint
    title: Add an HTTP Endpoint
    type: skill
    priority: 1
    trigger: |
      When adding a new HTTP route or extending the API surface.
    scope:
      languages: [java]
      frameworks: [spring-boot]
      tools: []
      tasks: [feature]
      tags: [delivery, http]
    steps:
      - Define a request record and a response record co-located with the controller.
      - Add a controller method that validates input, calls one application service, and shapes the response.
      - Implement or extend the application service so the endpoint can stay thin.
      - Add a test at the controller level that exercises validation and one happy-path call.
      - Update OpenAPI or equivalent API description if the project uses one.
    output_expectations:
      - Controller method under 20 lines.
      - Application service signature does not expose Spring or web types.
      - Test covering at least one input validation failure.
    notes: |
      If the new endpoint duplicates an existing one with a small variation, prefer extending the existing service over forking a parallel implementation.

  - id: add-ui-flow
    title: Add a UI Flow
    type: skill
    priority: 1
    trigger: |
      When adding a new screen, view, or interactive flow in the TUI.
    scope:
      languages: [java]
      frameworks: [tambo-ui]
      tools: []
      tasks: [feature]
      tags: [delivery, ui]
    steps:
      - Add a Screen enum value (or equivalent) and map it in the view router.
      - Implement the View; keep event handlers thin and delegate to an application service.
      - Add any required AppState fields with thread-safe types (volatile, AtomicReference, AtomicInteger).
      - Connect to the application service through its existing interface; do not call adapters directly.
      - Verify by running the TUI and walking the flow.
    output_expectations:
      - View has no domain branching.
      - State changes are visible in the UI within one tick.
      - Errors render with a clear color and message.
    notes: |
      Reuse existing widgets and layout patterns. Introducing a new layout style is a separate change.

  - id: wire-configuration
    title: Wire a New Configuration Setting
    type: skill
    priority: 2
    trigger: |
      When introducing a new tunable setting (env, properties file, or user-editable config).
    scope:
      languages: [java]
      frameworks: [spring-boot]
      tools: []
      tasks: [configuration]
      tags: [delivery]
    steps:
      - Add the property key to application.properties with a documented default.
      - Bind it through @ConfigurationProperties or an existing settings record; do not scatter @Value reads.
      - If user-editable at runtime, surface a field in the settings UI and persist to the user config file.
      - Reference the new setting from one well-named place; do not pass it through several layers as a parameter.
      - Update CLAUDE.md or README configuration section.
    output_expectations:
      - One typed accessor for the new setting.
      - A sensible default that keeps existing behavior unchanged when the setting is absent.
    notes: |
      Settings that change behavior should fire a settings-changed event so dependent components can refresh.
