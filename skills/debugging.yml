version: 1
skills:
  - id: fix-bug
    title: Fix a Bug
    type: skill
    priority: 1
    trigger: |
      When a defect is reported, a test fails, or a user-visible behavior is wrong.
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: [bugfix]
      tags: [debugging]
    steps:
      - Reproduce the failure locally with the smallest possible input.
      - Write a failing test that captures the bug at the right layer (unit if logic, integration if wiring).
      - Fix the root cause, not the symptom. If you find yourself adding a defensive check, ask whether the contract is wrong.
      - Confirm the new test passes and no others regress.
      - Write a commit message that names the bug and the root cause in one or two sentences.
    output_expectations:
      - A test that fails without the fix.
      - A diff scoped to the root cause only.
    notes: |
      A bug fix without a regression test invites the bug back.

  - id: trace-runtime-error
    title: Trace a Runtime Error
    type: skill
    priority: 2
    trigger: |
      When the app crashes or logs an unexpected error in development or production.
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: [bugfix]
      tags: [debugging, operability]
    steps:
      - Capture the full stack trace and the most recent log lines that preceded it.
      - Identify the boundary where the failure originated (HTTP call, file I/O, model call, database).
      - Confirm whether the error is a missing validation, a contract violation, or an external failure.
      - For missing validation, add the validation at the boundary.
      - For contract violations, fix the caller, not the callee.
      - For external failures, verify retries, timeouts, and the failure metric exist.
    output_expectations:
      - A diagnosis sentence that names cause and category.
      - A change that prevents the same error from recurring silently.
    notes: |
      An error logged but not surfaced to a metric is a future incident.

