version: 1
adapter:
  id: cursor
  target: Cursor
  description: |
    Rendering target for Cursor. Cursor reads .cursor/rules/*.mdc files matching configured globs.
    A single launchpad-standards.mdc is sufficient for the default pack; teams can split into
    multiple .mdc files later if they want per-language or per-task rule scoping.
  outputs:
    - path: .cursor/rules/launchpad-standards.mdc
      kind: rules
      includes: [rules, skills, checklists]
      frontmatter:
        description: Engineering rules, workflow skills, and checklists for this project
        globs: "**/*"
      notes: |
        Cursor consumes .mdc with YAML frontmatter (description, globs).
