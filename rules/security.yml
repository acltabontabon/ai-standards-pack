version: 1
rules:
  - id: no-secret-logging
    title: No Secrets in Logs
    type: rule
    severity: never
    priority: 1
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, logging]
    content: |
      Do not log credentials, tokens, API keys, signed URLs, or full request/response bodies that may carry them.
      Apply redaction at the logger level for sensitive fields.
    rationale: |
      A leaked log file is a credential leak. Logs are easier to exfiltrate than databases.
    check:
      kind: forbid-pattern
      pattern: '(?i)log\.\w+\([^)]*\b(password|secret|apiKey|api_key|access_?token|refresh_?token|private_?key|client_?secret|bearer)\b'
      includes:
        - "**/*.java"
      excludes:
        - "**/test/**"
        - "**/*Test.java"

  - id: validate-external-input
    title: Validate External Input
    type: rule
    severity: must
    priority: 1
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, boundaries]
    content: |
      Validate type, length, range, and format at every trust boundary: request bodies, query params, file uploads, message payloads.
      Reject malformed input early with a deterministic error.
    rationale: |
      Validation at the boundary is the cheapest place to stop bad data.

  - id: redact-sensitive-context
    title: Redact Sensitive Context in Traces
    type: rule
    severity: must
    priority: 2
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, observability]
    content: |
      Strip sensitive fields from span tags, error reports, and crash dumps.
      Apply the same redaction policy everywhere; do not invent per-feature rules.
    rationale: |
      Crash reporters and tracers are often less protected than the primary log pipeline.

  - id: least-privilege-config
    title: Least-Privilege Config
    type: rule
    severity: must
    priority: 2
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, configuration]
    content: |
      Credentials granted to a service expose the minimum set of operations needed for its current features.
      Do not reuse a high-privilege key because it is already configured.
    rationale: |
      A scoped credential limits blast radius when it leaks.

  - id: safe-file-writes
    title: Safe File Writes
    type: rule
    severity: must
    priority: 2
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, filesystem]
    content: |
      Resolve user-controlled paths against a fixed base directory and reject paths that escape it.
      Do not pass user input directly to file APIs.
    rationale: |
      Path traversal is the most common file-system vulnerability and the easiest to prevent. (OWASP A01:2021 - Broken Access Control / CWE-22.)

  - id: secrets-not-in-source
    title: Secrets Live Outside Source Control
    type: rule
    severity: never
    priority: 1
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, configuration]
    content: |
      API keys, tokens, database passwords, signing keys, and similar secrets are loaded from environment variables, a secrets manager (Vault, AWS Secrets Manager, GCP Secret Manager), or runtime-mounted files - never committed to git, never hard-coded in source or properties files.
      `.gitignore` excludes local `.env` files. A pre-commit hook (e.g. gitleaks, trufflehog) blocks accidental commits.
    rationale: |
      Once a secret reaches git history, it must be considered leaked - rotation is the only fix and history rewrites do not protect against forks and clones. (OWASP A02:2021 - Cryptographic Failures / A05:2021 - Security Misconfiguration / CWE-798.)

  - id: modern-password-hashing
    title: Modern Password Hashing
    type: rule
    severity: must
    priority: 1
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, crypto]
    content: |
      Passwords are stored using a memory-hard adaptive hash: Argon2id (preferred), scrypt, or bcrypt. Never SHA-256, SHA-512, MD5, or any general-purpose hash, even with a salt.
      Use the platform's well-known library (Spring Security's `PasswordEncoder`, libsodium, passlib); do not implement hashing primitives by hand.
    rationale: |
      General-purpose hashes are billions of guesses per second on modern GPUs - they offer no real protection. Adaptive memory-hard hashes raise the cost per guess by orders of magnitude. (OWASP A02:2021 - Cryptographic Failures, OWASP Password Storage Cheat Sheet.)

  - id: transport-security-tls-required
    title: TLS Required for All Traffic
    type: rule
    severity: must
    priority: 1
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, network]
    content: |
      All network traffic carrying user data, credentials, or cookies uses TLS 1.2 or higher. Plain HTTP is reserved for local development.
      HTTP requests to a TLS endpoint are redirected to HTTPS; production responses set `Strict-Transport-Security` with a long `max-age` and `includeSubDomains`.
    rationale: |
      Without TLS, any network hop can read or modify traffic. HSTS prevents downgrade attacks. (OWASP A02:2021 - Cryptographic Failures, RFC 6797.)

  - id: output-encoding-context-aware
    title: Context-Aware Output Encoding
    type: rule
    severity: must
    priority: 1
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, web]
    content: |
      User-controlled data rendered to HTML, JavaScript, CSS, URL, or SQL contexts goes through the encoder for that specific context.
      Use the framework's built-in escaping (Thymeleaf auto-escape, React JSX, OWASP Java Encoder) rather than ad-hoc string replacement. Never construct queries by string concatenation - use parameterized statements.
    rationale: |
      Mixing contexts (e.g. URL-encoding then dropping into HTML) creates injection bypasses. Context-aware encoders are the only reliable defense. (OWASP A03:2021 - Injection / CWE-79, CWE-89.)

  - id: dependency-vulnerability-scanning
    title: Scan Dependencies for Known Vulnerabilities
    type: rule
    severity: must
    priority: 2
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, supply-chain]
    content: |
      The build runs a dependency-vulnerability scanner (OWASP Dependency-Check, Snyk, GitHub Dependabot, Trivy, OSV-Scanner) on every PR and on a schedule.
      High and critical CVEs block release unless the team has documented an explicit accept-risk decision with an expiry date.
    rationale: |
      The vast majority of breached production code paths in recent years involve a transitive dependency with a published CVE. Continuous scanning is the cheap fix. (OWASP A06:2021 - Vulnerable and Outdated Components.)

  - id: auth-and-session-defaults-secure
    title: Authentication and Session Defaults Are Secure
    type: rule
    severity: must
    priority: 1
    scope:
      languages: []
      frameworks: []
      tools: []
      tasks: []
      tags: [security, auth, web]
    content: |
      Use the platform's well-maintained auth library (Spring Security, Devise, Passport, Auth.js); do not roll your own session, token, or password reset flows. Session cookies are `HttpOnly`, `Secure`, and `SameSite=Lax` (or `Strict`).
      Authentication failures use a generic message ("invalid credentials"), never reveal whether the username exists. Login endpoints have stricter rate limits than the default.
    rationale: |
      Homegrown auth consistently leaks (timing oracles, missing CSRF, predictable tokens, enumeration). The well-maintained libraries have been hardened by years of public attack. (OWASP A07:2021 - Identification and Authentication Failures.)
