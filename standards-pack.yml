id: launchpad-default-ai-standards
version: 1.0.0
name: Launchpad Default AI Standards
description: |
  Default standards pack for preparing repo-aware AI coding context and handoff prompts.

  Tech leads author the rules, skills, checklists, prompts, and adapter rendering
  targets in this pack. Launchpad resolves the pack against a target repository
  and renders AI tool instructions (Claude, Cursor, generic) using the adapter files.

  Launchpad prepares. Paid AI coding agents execute against the rendered output.
maintainers:
  - Launchpad
includes:
  rules:
    - rules/engineering.yml
    - rules/java.yml
    - rules/spring-boot.yml
    - rules/spring-ai.yml
    - rules/rest-api.yml
    - rules/testing.yml
    - rules/architecture.yml
    - rules/security.yml
    - rules/reliability.yml
    - rules/tambo-ui.yml
  skills:
    - skills/delivery.yml
    - skills/debugging.yml
    - skills/refactoring.yml
    - skills/review.yml
    - skills/spring-ai.yml
  checklists:
    - checklists/pull-request.yml
    - checklists/production-readiness.yml
    - checklists/ai-generated-code.yml
    - checklists/rest-api.yml
  prompts:
    - prompts/implementation-plan.yml
    - prompts/code-review.yml
    - prompts/handoff.yml
adapters:
  generic: adapters/generic.yml
  claude: adapters/claude.yml
  cursor: adapters/cursor.yml
