id: launchpad-default-ai-standards
version: 1.0.0
name: Launchpad Default AI Standards
description: |
  Default standards pack for preparing repo-aware AI coding context and handoff prompts.

  Tech leads author the rules, skills, checklists, prompts, and the AGENTS.md
  rendering target in this pack. Launchpad resolves the pack against a target
  repository, renders AGENTS.md + .ai/* canonically, and dispatches to
  developer-selected AgentProjection beans (.claude/skills/, .cursor/rules/,
  .windsurf/rules/) for agent-native discovery files.

  Launchpad prepares. Paid AI coding agents execute against the rendered output.
maintainers:
  - Launchpad
includes:
  rules:
    - rules/engineering.yml
    - rules/architecture.yml
    - rules/ddd.yml
    - rules/event-driven.yml
    - rules/twelve-factor.yml
    - rules/microservices.yml
    - rules/testing.yml
    - rules/reliability.yml
    - rules/rest-api.yml
    - rules/security.yml
    - rules/ai-integration.yml
    - rules/java.yml
    - rules/spring-boot.yml
  skills:
    - skills/delivery.yml
    - skills/debugging.yml
    - skills/review.yml
    - skills/spring-ai.yml
    - skills/security.yml
    - skills/operability.yml
    - skills/lifecycle.yml
  checklists:
    - checklists/pull-request.yml
    - checklists/production-readiness.yml
    - checklists/ai-generated-code.yml
    - checklists/rest-api.yml
  prompts:
    - prompts/implementation-plan.yml
    - prompts/code-review.yml
    - prompts/handoff.yml
adapters:
  agents: adapters/agents.yml
